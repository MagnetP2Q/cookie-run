[package]
name = "cookie-run"
version = "0.1.0"
edition = "2021"
[lib]
name = "cookie_run_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
wait-timeout = "0.2"
rustdct = "0.7"
windows = { version = "0.58", features = ["Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams"] }
